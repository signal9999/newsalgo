version: "3.9"

services:
  # ─────────────────────────────────────
  # Redis: 重複排除キャッシュ（TTL 300秒）
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: newsalgo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

volumes:
  redis_data:
    driver: local
