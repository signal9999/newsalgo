name: NewsAlgo CD — VPS Auto Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "newsalgo_knowledge_*.md"
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイ先"
        required: false
        default: "vps"

# main へのプッシュ時に自動でVPSにデプロイ
# 必要な Secrets:
#   VPS_HOST     - VPS の IP アドレスまたはホスト名
#   VPS_USER     - SSH ユーザー名（例: ubuntu）
#   VPS_SSH_KEY  - SSH 秘密鍵（-----BEGIN ... -----END ... で始まる全文）

jobs:
  # ── テスト ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt tzdata

      - name: Run tests
        run: python -m pytest tests/ -q

  # ── Docker ビルド & プッシュ（GitHub Container Registry） ─────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── VPS デプロイ（SSH） ────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # VPS_HOST が設定されている場合のみ実行
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/newsalgo

            # 最新コードを取得
            git pull origin main

            # Docker イメージを更新
            docker compose pull scheduler || true
            docker compose up -d --build redis scheduler

            # ヘルスチェック待機
            sleep 15
            docker compose ps

            # ログ確認
            docker compose logs --tail=20 scheduler

            echo "✅ デプロイ完了: $(date '+%Y-%m-%d %H:%M:%S')"

  # ── デプロイ通知 ──────────────────────────────────────────────────────────
  notify:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack 通知
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ needs.build.result == 'success' && '✅' || '❌' }} *NewsAlgo* デプロイ ${{ needs.build.result }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|詳細を見る>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
